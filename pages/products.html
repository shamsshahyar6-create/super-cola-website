<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>محصولات | سوپرکولا</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">س</div>
          <div>
            <strong>سوپرکولا</strong>
            <small>سیستم مدیریت شرکت</small>
          </div>
        </div>
        <div class="sidebar-label">مدیریت سیستم</div>
        <nav class="nav-list">
          <a class="nav-item" data-page="dashboard.html">▦ داشبورد</a>
          <a class="nav-item" data-page="orders.html">▤ سفارش‌ها</a>
          <a class="nav-item active" data-page="products.html">◫ محصولات</a>
          <a class="nav-item" data-page="customers.html">♙ مشتریان</a>
          <a class="nav-item" data-page="warehouse.html">▥ انبار</a>
          <a class="nav-item" data-page="reports.html">▥ گزارش‌ها</a>
        </nav>
        <div class="sidebar-footer">
          <div class="user-avatar">م</div>
          <div>
            <strong id="userName">کاربر</strong>
            <small id="userRole">کارمند</small>
          </div>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb">
            <button class="icon-button" id="menuButton">☰</button>
            خانه /
            <strong>محصولات</strong>
          </div>
          <button class="icon-button" id="logoutButton">↪</button>
        </header>
        <section class="page-container">
          <div class="page-heading">
            <div>
              <p class="eyebrow">کاتالوگ کالا</p>
              <h1>محصولات</h1>
              <p>فهرست و قیمت محصولات شرکت را مدیریت کنید.</p>
            </div>
            <button class="button primary" id="newProductButton">
              ＋ محصول جدید
            </button>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h2>فهرست محصولات</h2>
              <input
                class="button secondary"
                id="productSearch"
                placeholder="جست‌وجوی محصول"
              />
            </div>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>کد</th>
                    <th>نام محصول</th>
                    <th>دسته</th>
                    <th>قیمت فروش</th>
                    <th>وضعیت</th>
                  </tr>
                </thead>
                <tbody id="productsRows"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div class="modal-backdrop" id="productModal">
      <section class="modal">
        <div class="modal-head">
          <div>
            <h2>ثبت محصول جدید</h2>
            <p>مشخصات محصول را وارد کنید.</p>
          </div>
          <button class="icon-button" id="closeProductModal" type="button">
            ×
          </button>
        </div>
        <form class="form" id="productForm">
          <label>
            کد محصول
            <input name="code" required />
          </label>
          <label>
            نام محصول
            <input name="name" required />
          </label>
          <label>
            دسته‌بندی
            <select name="category">
              <option>نوشیدنی گازدار</option>
              <option>نوشیدنی انرژی‌زا</option>
              <option>نوشیدنی مالت</option>
              <option>آب و سایر نوشیدنی‌ها</option>
            </select>
          </label>
          <label>
            قیمت فروش (افغانی)
            <input name="price" required type="number" min="0" />
          </label>
          <label>
            موجودی اولیه (کارتن)
            <input name="stock" required type="number" min="0" />
          </label>
          <label>
            حداقل موجودی
            <input name="minimum" required type="number" min="0" />
          </label>
          <button class="button primary" type="submit">ذخیره محصول</button>
        </form>
      </section>
    </div>
    <script src="../js/auth.js"></script>
    <script src="../js/app-shell.js"></script>
    <script src="../js/data-store.js"></script>
    <script src="../js/products.js"></script>
  </body>
</html>
