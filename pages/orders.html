<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>سفارش‌ها | سوپرکولا</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">س</div>
          <div>
            <strong>سوپرکولا</strong>
            <small>سیستم مدیریت شرکت</small>
          </div>
        </div>
        <div class="sidebar-label">مدیریت سیستم</div>
        <nav class="nav-list">
          <a class="nav-item" data-page="dashboard.html">▦ داشبورد</a>
          <a class="nav-item active" data-page="orders.html">▤ سفارش‌ها</a>
          <a class="nav-item" data-page="products.html">◫ محصولات</a>
          <a class="nav-item" data-page="customers.html">♙ مشتریان</a>
          <a class="nav-item" data-page="warehouse.html">▥ انبار</a>
          <a class="nav-item" data-page="reports.html">▥ گزارش‌ها</a>
        </nav>
        <div class="sidebar-footer">
          <div class="user-avatar">ف</div>
          <div>
            <strong id="userName">کاربر</strong>
            <small id="userRole">کارمند</small>
          </div>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb">
            <button class="icon-button" id="menuButton">☰</button>
            خانه /
            <strong>سفارش‌ها</strong>
          </div>
          <button class="icon-button" id="logoutButton">↪</button>
        </header>
        <section class="page-container">
          <div class="page-heading">
            <div>
              <p class="eyebrow">فروش و توزیع</p>
              <h1>سفارش‌ها</h1>
              <p>سفارش‌های مشتریان را ثبت و پیگیری کنید.</p>
            </div>
            <button class="button primary" id="newOrderButton">
              ＋ سفارش جدید
            </button>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h2>فهرست سفارش‌ها</h2>
              <div>
                <input
                  class="button secondary"
                  id="orderSearch"
                  placeholder="جست‌وجوی مشتری"
                />
                <select class="button secondary" id="orderFilter">
                  <option value="">همه وضعیت‌ها</option>
                  <option>تحویل شده</option>
                  <option>در حال پردازش</option>
                  <option>در انتظار پرداخت</option>
                </select>
              </div>
            </div>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>شماره</th>
                    <th>مشتری</th>
                    <th>مبلغ</th>
                    <th>تاریخ</th>
                    <th>وضعیت</th>
                  </tr>
                </thead>
                <tbody id="ordersRows"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div class="modal-backdrop" id="orderModal">
      <section class="modal">
        <div class="modal-head">
          <div>
            <h2>ثبت سفارش جدید</h2>
            <p>معلومات سفارش مشتری را وارد کنید.</p>
          </div>
          <button class="icon-button" id="closeOrderModal">×</button>
        </div>
        <form class="form" id="orderForm">
          <label>
            نام مشتری
            <input name="customer" required />
          </label>
          <label>
            مبلغ (افغانی)
            <input name="amount" required inputmode="numeric" />
          </label>
          <button class="button primary" type="submit">ثبت سفارش</button>
        </form>
      </section>
    </div>
    <script src="../js/auth.js"></script>
    <script src="../js/app-shell.js"></script>
    <script src="../js/data-store.js"></script>
    <script src="../js/orders.js"></script>
  </body>
</html>
