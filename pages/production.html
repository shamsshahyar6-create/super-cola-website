<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>تولید | سوپرکولا</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <main class="page-container">
      <div class="page-heading">
        <div>
          <p class="eyebrow">کارخانه</p>
          <h1>تولید</h1>
          <p>برنامه‌ریزی تولید، بچ‌ها و کارکرد خطوط تولید.</p>
        </div>
        <button class="button primary" data-action="back">بازگشت</button>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>برنامه تولید امروز</h2>
          <button class="button secondary">＋ برنامه جدید</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>شماره بچ</th>
              <th>محصول</th>
              <th>خط تولید</th>
              <th>مقدار</th>
              <th>تاریخ تولید</th>
              <th>وضعیت</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>BT-۱۴۰۵۰۱</td>
              <td>Super Cola</td>
              <td>خط یک</td>
              <td>۵۰۰ کارتن</td>
              <td>امروز</td>
              <td><span class="status orange">در حال تولید</span></td>
            </tr>
            <tr>
              <td>BT-۱۴۰۵۰۰</td>
              <td>Super Orange</td>
              <td>خط دو</td>
              <td>۳۲۰ کارتن</td>
              <td>امروز</td>
              <td><span class="status green">تکمیل شده</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/app-shell.js"></script>
    <script src="../js/page-runtime.js"></script>
  </body>
</html>
