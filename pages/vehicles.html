<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>موترها و رانندگان | سوپرکولا</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <main class="page-container">
      <div class="page-heading">
        <div>
          <p class="eyebrow">ترانسپورت</p>
          <h1>موترها و رانندگان</h1>
          <p>مدیریت وسایط، ظرفیت، راننده و سرویس دوره‌ای.</p>
        </div>
        <button class="button primary" data-action="back">بازگشت</button>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>ناوگان شرکت</h2>
          <button class="button secondary">＋ موتر جدید</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>نمبر پلیت</th>
              <th>نوع موتر</th>
              <th>راننده</th>
              <th>ظرفیت</th>
              <th>سرویس بعدی</th>
              <th>وضعیت</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>کابل ۱۲۳۴</td>
              <td>موتر باربری</td>
              <td>حسن مرادی</td>
              <td>۳ تن</td>
              <td>ماه آینده</td>
              <td><span class="status green">فعال</span></td>
            </tr>
            <tr>
              <td>کابل ۵۶۷۸</td>
              <td>موتر باربری</td>
              <td>امیر نادری</td>
              <td>۵ تن</td>
              <td>هفته آینده</td>
              <td><span class="status orange">سرویس نزدیک</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/app-shell.js"></script>
    <script src="../js/page-runtime.js"></script>
  </body>
</html>
