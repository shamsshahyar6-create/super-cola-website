<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>لاگ رویدادها | سوپرکولا</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <main class="page-container">
      <div class="page-heading">
        <div>
          <p class="eyebrow">امنیت و نظارت</p>
          <h1>لاگ رویدادها</h1>
          <p>ثبت تغییرات و فعالیت‌های انجام‌شده در سیستم.</p>
        </div>
        <button class="button primary" data-action="back">بازگشت</button>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>آخرین فعالیت‌ها</h2>
          <button class="button secondary">دانلود گزارش</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>کاربر</th>
              <th>رویداد</th>
              <th>بخش</th>
              <th>زمان</th>
              <th>نتیجه</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>علی رضایی</td>
              <td>ورود به سیستم</td>
              <td>احراز هویت</td>
              <td>امروز، ۰۸:۰۰</td>
              <td><span class="status green">موفق</span></td>
            </tr>
            <tr>
              <td>مریم احمدی</td>
              <td>ثبت خروج کالا</td>
              <td>انبار</td>
              <td>امروز، ۰۹:۱۵</td>
              <td><span class="status green">موفق</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/app-shell.js"></script>
    <script src="../js/page-runtime.js"></script>
  </body>
</html>
