<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>مشتریان | سوپرکولا</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">س</div>
          <div>
            <strong>سوپرکولا</strong>
            <small>سیستم مدیریت شرکت</small>
          </div>
        </div>
        <div class="sidebar-label">مدیریت سیستم</div>
        <nav class="nav-list">
          <a class="nav-item" data-page="dashboard.html">▦ داشبورد</a>
          <a class="nav-item" data-page="orders.html">▤ سفارش‌ها</a>
          <a class="nav-item" data-page="products.html">◫ محصولات</a>
          <a class="nav-item active" data-page="customers.html">♙ مشتریان</a>
          <a class="nav-item" data-page="warehouse.html">▥ انبار</a>
          <a class="nav-item" data-page="reports.html">▥ گزارش‌ها</a>
        </nav>
        <div class="sidebar-footer">
          <div class="user-avatar">م</div>
          <div>
            <strong id="userName">کاربر</strong>
            <small id="userRole">کارمند</small>
          </div>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb">
            <button class="icon-button" id="menuButton">☰</button>
            خانه /
            <strong>مشتریان</strong>
          </div>
          <button class="icon-button" id="logoutButton">↪</button>
        </header>
        <section class="page-container">
          <div class="page-heading">
            <div>
              <p class="eyebrow">ارتباط با مشتری</p>
              <h1>مشتریان</h1>
              <p>فروشگاه‌ها و سوابق همکاری را مدیریت کنید.</p>
            </div>
            <button class="button primary" id="newCustomerButton">
              ＋ مشتری جدید
            </button>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h2>فهرست مشتریان</h2>
              <input
                class="button secondary"
                id="customerSearch"
                placeholder="جست‌وجوی مشتری"
              />
            </div>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>نام مشتری</th>
                    <th>نوع</th>
                    <th>تلفن</th>
                    <th>آخرین سفارش</th>
                    <th>وضعیت</th>
                  </tr>
                </thead>
                <tbody id="customersRows"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div class="modal-backdrop" id="customerModal">
      <section class="modal">
        <div class="modal-head">
          <div>
            <h2>ثبت مشتری جدید</h2>
            <p>معلومات مشتری را وارد کنید.</p>
          </div>
          <button class="icon-button" id="closeCustomerModal" type="button">
            ×
          </button>
        </div>
        <form class="form" id="customerForm">
          <label>
            نام مشتری یا شرکت
            <input name="name" required />
          </label>
          <label>
            نوع مشتری
            <select name="type">
              <option>خرده‌فروشی</option>
              <option>سازمانی</option>
              <option>توزیع‌کننده</option>
            </select>
          </label>
          <label>
            شماره تماس
            <input name="phone" required type="tel" />
          </label>
          <button class="button primary" type="submit">ذخیره مشتری</button>
        </form>
      </section>
    </div>
    <script src="../js/auth.js"></script>
    <script src="../js/app-shell.js"></script>
    <script src="../js/data-store.js"></script>
    <script src="../js/customers.js"></script>
  </body>
</html>
