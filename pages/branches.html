<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>نمایندگی‌ها | سوپرکولا</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <main class="page-container">
      <div class="page-heading">
        <div>
          <p class="eyebrow">شبکه فروش</p>
          <h1>نمایندگی‌ها</h1>
          <p>مدیریت نمایندگی‌ها، هدف فروش و بدهی هر نمایندگی.</p>
        </div>
        <button class="button primary" data-action="back">بازگشت</button>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>نمایندگی‌های فعال</h2>
          <button class="button secondary">＋ نمایندگی جدید</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>نام نمایندگی</th>
              <th>شهر</th>
              <th>مدیر</th>
              <th>هدف ماهانه</th>
              <th>فروش ماهانه</th>
              <th>وضعیت</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>نمایندگی کابل مرکزی</td>
              <td>کابل</td>
              <td>احمد نوری</td>
              <td>۵۰۰,۰۰۰ افغانی</td>
              <td>۴۳۰,۰۰۰ افغانی</td>
              <td><span class="status green">فعال</span></td>
            </tr>
            <tr>
              <td>نمایندگی هرات</td>
              <td>هرات</td>
              <td>فرید رحمانی</td>
              <td>۳۰۰,۰۰۰ افغانی</td>
              <td>۲۸۰,۰۰۰ افغانی</td>
              <td><span class="status green">فعال</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/app-shell.js"></script>
    <script src="../js/page-runtime.js"></script>
  </body>
</html>
